name: Native services, LUS host and canonical RDP/RSP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hosted runners only. Synthetic/procedural inputs; no ROMs or artifact uploads.
jobs:
  linux:
    name: Linux ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: GCC, cc: gcc, cxx: g++ }
          - { name: Clang, cc: clang, cxx: clang++ }
        preset: [linux-debug, linux-release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out original native sources
        # actions/checkout v6.1.0, verified with upstream git ls-remote.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Configure native services, exact C dispatcher and bounded RSP
        run: cmake --preset ${{ matrix.preset }} -DISLE_BUILD_GAME_ENGINE=ON -DISLE_BUILD_RSP_PROBE=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Run synthetic tests (including Release)
        run: ctest --preset ${{ matrix.preset }}
      - name: Exercise the actual CLI
        run: build/${{ matrix.preset }}/35mmisle-rom --help
      - name: Exercise the coprocessor CLI without a ROM
        run: build/${{ matrix.preset }}/35mmisle-rsp-probe --help
      - name: Install only the CLI and license
        run: cmake --install build/${{ matrix.preset }}
      - name: Package tooling locally without uploading
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -B build/${{ matrix.preset }}/packages

  windows:
    name: Windows MSVC x64 / ${{ matrix.preset }}
    # This is a toolchain CI runner, not a Windows 11 game qualification claim.
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-debug, configuration: Debug }
          - { preset: windows-release, configuration: Release }
    steps:
      - name: Check out original native sources
        # actions/checkout v6.1.0, verified with upstream git ls-remote.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Configure native services, exact C dispatcher and bounded RSP
        run: cmake --preset ${{ matrix.preset }} -DISLE_BUILD_GAME_ENGINE=ON -DISLE_BUILD_RSP_PROBE=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Run synthetic tests (including Release)
        run: ctest --preset ${{ matrix.preset }}
      - name: Exercise both CLIs and a Unicode input path
        shell: pwsh
        run: |
          $exe = "./build/${{ matrix.preset }}/${{ matrix.configuration }}/35mmisle-rom.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed" }
          $rspExe = "./build/${{ matrix.preset }}/${{ matrix.configuration }}/35mmisle-rsp-probe.exe"
          & $rspExe --help
          if ($LASTEXITCODE -ne 0) { throw "RSP CLI help failed" }
          $inputPath = Join-Path $env:RUNNER_TEMP "35mmIsle 路径 spaces.z64"
          [System.IO.File]::WriteAllBytes($inputPath, [byte[]]@(0x80, 0x37, 0x12, 0x40))
          try {
            & $exe check $inputPath
            if ($LASTEXITCODE -ne 1) { throw "CLI accepted invalid input or failed unexpectedly" }
            & $rspExe --rom $inputPath
            if ($LASTEXITCODE -ne 1) { throw "RSP CLI accepted invalid input or failed unexpectedly" }
          } finally {
            Remove-Item -LiteralPath $inputPath -Force
          }
          exit 0
      - name: Install only the CLI and license
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.configuration }}
      - name: Package tooling locally without uploading
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -C ${{ matrix.configuration }} -B build/${{ matrix.preset }}/packages

  windows-host:
    name: Windows MSVC x64 / static-runtime LUS + audio + RSP + RDP + native engine
    # Hosted compiler/CPU/CLI proof, not a Windows 11, graphics or audio-device claim.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out native sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Provision frozen vcpkg source and SHA256-verified tool
        run: ./tools/prepare_windows_host.ps1 -Root "$env:RUNNER_TEMP/35mmisle-windows-host-vcpkg"
      - name: Configure actual static-runtime host and audio before project discovery
        run: cmake --preset windows-host-release
      - name: Build full LUS, audio, RSP, canonical RDP, native engine and CPU tests with MSVC
        run: cmake --build --preset windows-host-release --parallel 2
      - name: Run all ROMless CPU CTests
        run: ctest --preset windows-host-release
      - name: Exercise help without graphics, audio devices or ROMs
        run: |
          foreach ($name in @('rom', 'host-probe', 'audio-probe', 'rsp-probe', 'rdp-probe')) {
            & "./build/windows-host-release/Release/35mmisle-$name.exe" --help
            if ($LASTEXITCODE -ne 0) { throw "$name help failed" }
          }
      # No ROM/private payload, executable artifact upload or binary-release admission.

  linux-host:
    name: Linux LUS / SDL3 / Mesa EGL procedural probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out native sources
        # actions/checkout v6.1.0; immutable action pin shared with the core matrix.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out immutable SDL3 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: libsdl-org/SDL
          # release-3.4.2, resolved and version-checked on 2026-10-14.
          ref: 683181b47cfabd293e3ea409f838915b8297a4fd
          path: build-dependencies/SDL
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install host headers and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ninja-build pkg-config libzip-dev zipcmp zipmerge ziptool nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libgl-dev libopengl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libudev-dev xvfb xauth
      - name: Build and install pinned SDL3 outside the source tree
        run: |
          cmake -S build-dependencies/SDL -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/host-prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_INSTALL=ON -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_X11=ON -DSDL_WAYLAND=OFF -DSDL_OPENGL=ON -DSDL_OPENGLES=ON
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel 2
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Configure genuine pinned LUS host and all synthetic tests
        # Empty ISLE_LUS_SOURCE_DIR fetches the enforced immutable LUS commit.
        # System packages/runner images are not a fully locked release composition.
        run: |
          cmake -S . -B build/linux-host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DISLE_BUILD_HOST_PROBE=ON -DISLE_LUS_SOURCE_DIR= \
            -DISLE_BUILD_GAME_ENGINE=ON -DISLE_SNAP_SOURCE_DIR= \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/host-prefix"
      - name: Build host and original services
        run: cmake --build build/linux-host --parallel 2
      - name: Run all Release-active synthetic tests
        run: ctest --test-dir build/linux-host --output-on-failure --no-tests=error
      - name: Require bounded real renderer submission and owner teardown
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/host-prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XDG_DATA_HOME="$RUNNER_TEMP/host-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/host-config"
          probe_output="$(timeout 90s xvfb-run --auto-servernum \
            --server-args="-screen 0 800x600x24 -nolisten tcp" \
            env SDL_VIDEODRIVER=x11 SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux-host/35mmisle-host-probe --frames 240 2>&1)"
          printf '%s\n' "$probe_output"
          [[ "$probe_output" == *"FIRST_SUCCESSFUL_RENDERER_FRAME:"* ]]
          [[ "$probe_output" == *"Submitted 240 real-renderer frames;"* ]]
          [[ "$probe_output" == *"HOST_OWNERS_RELEASED:"* ]]
          # Submission/lifetime markers are not pixel or game-fidelity assertions.

  linux-rdp:
    name: Linux canonical RDP / actual CPU Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out native sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install headless Vulkan loader and real software ICD
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build libvulkan1 mesa-vulkan-drivers
      - name: Configure exact renderer and shader compiler closure
        run: |
          cmake -S . -B build/linux-rdp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DISLE_BUILD_RDP_PROBE=ON -DISLE_BUILD_RSP_PROBE=ON
      - name: Build real renderer and original packet workload
        run: cmake --build build/linux-rdp --target 35mmisle-rdp-probe 35mmisle-rsp-probe --parallel 2
      - name: Execute exact packed-depth, coverage and GPU-copy checks
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/rdp-cache"
          timeout 120s build/linux-rdp/35mmisle-rdp-probe --cpu-device \
            --raw-out "$RUNNER_TEMP/rdp-synthetic-raw"
          # Built-in checks inspect all region/hidden bytes after real timeline
          # completion. No ROM, VI window, native game or hardware-parity claim.
      - name: Exercise combined coprocessor renderer CLI without a ROM
        run: build/linux-rdp/35mmisle-rsp-probe --help

  windows-rdp:
    name: Windows MSVC x64 / canonical RDP build
    # Compiler/CLI proof only; no Windows Vulkan ICD or Windows 11 run claimed.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out native sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Configure exact renderer and shader compiler closure
        run: |
          cmake -S . -B build/windows-rdp -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=OFF -DISLE_BUILD_RDP_PROBE=ON -DISLE_BUILD_RSP_PROBE=ON
      - name: Build actual MSVC renderer and shader tool
        run: cmake --build build/windows-rdp --config Release --target 35mmisle-rdp-probe 35mmisle-rsp-probe --parallel 2
      - name: Exercise native CLI and fail-closed Unicode output ownership
        shell: pwsh
        run: |
          $exe = "./build/windows-rdp/Release/35mmisle-rdp-probe.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "RDP CLI help failed" }
          & "./build/windows-rdp/Release/35mmisle-rsp-probe.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Combined RSP CLI help failed" }
          $existing = Join-Path $env:RUNNER_TEMP "RDP 路径 spaces"
          New-Item -ItemType Directory -Path $existing -ErrorAction Stop | Out-Null
          try {
            & $exe --raw-out $existing
            if ($LASTEXITCODE -ne 1) { throw "RDP CLI accepted owned output or failed unexpectedly" }
            if (Get-ChildItem -LiteralPath $existing -Force) {
              throw "Rejected output directory was modified"
            }
          } finally {
            Remove-Item -LiteralPath $existing -Force
          }
          exit 0
